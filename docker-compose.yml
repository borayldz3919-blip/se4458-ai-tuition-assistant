# Local run of the whole system:  docker compose up --build
#   Gateway (all REST): http://localhost:8000   Swagger: http://localhost:8000/docs
#   MCP server:         http://localhost:8001/mcp
#   Chat UI:            http://localhost:8080
# The Tuition API has NO published port: it is reachable only through the gateway.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition
      POSTGRES_DB: tuition
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition"]
      interval: 3s
      retries: 20

  api:
    build: ./tuition_api
    environment:
      DATABASE_URL: postgresql+psycopg://tuition:tuition@db:5432/tuition
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: tuition-auth
      MOBILE_DAILY_LIMIT: "3"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-local-dev-gateway-secret}
    depends_on:
      db: {condition: service_healthy}

  gateway:
    build: ./gateway
    environment:
      API_UPSTREAM: http://api:8000
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: tuition-auth
      MOBILE_DAILY_LIMIT: "3"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-local-dev-gateway-secret}
    ports: ["8000:8000"]
    depends_on: [api]

  mcp:
    build: ./mcp_server
    ports: ["8001:8001"]

  agent:
    build: ./agent
    environment:
      GATEWAY_URL: http://gateway:8000
      MCP_URL: http://mcp:8001/mcp
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.5-flash}
    volumes: ["./agent/logs:/srv/logs"]
    ports: ["8080:8080"]
    depends_on: [gateway, mcp]

  # Unit tests (not started by `up`):  docker compose --profile test run --rm tests
  # API tests run against PostgreSQL (separate database `tuition_test`, the demo data is not touched).
  tests:
    image: python:3.12-slim
    profiles: ["test"]
    working_dir: /repo
    volumes: ["./:/repo"]
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEST_DATABASE_URL: postgresql+psycopg://tuition:tuition@db:5432/tuition_test
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "scripts/run_tests.sh"]

volumes:
  pgdata:
